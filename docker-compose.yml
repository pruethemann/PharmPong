services:
  postgres:
    image: postgres:17-alpine
    container_name: pharmapong-postgres
    environment:
      POSTGRES_USER: pharmapong
      POSTGRES_PASSWORD: pharmapong
      POSTGRES_DB: pharmapong_dev
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmapong -d pharmapong_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pharmapong
      MINIO_ROOT_PASSWORD: pharmapong-secret
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  pgdata:
